# テストを走らせ、ブラウザ版（Web）を書き出す。main に入ったときは GitHub Pages に公開する。
name: Web版の書き出しと公開

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7.1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Godot と書き出し用テンプレートを用意する（キャッシュがあれば使う）
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-web

      - name: Godot をダウンロードする
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          mkdir -p ~/godot
          curl -sSLo godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
          # テンプレートは全機種分で 1GB 以上あるので、Web 用だけ取り出す
          curl -sSLo templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          dir=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$dir"
          unzip -q -j templates.tpz 'templates/web_*' 'templates/version.txt' -d "$dir"
          rm godot.zip templates.tpz

      - name: 素材を読み込む
        run: ~/godot/godot --headless --path . --import

      - name: テストを走らせる
        run: ~/godot/godot --headless --path . -s tests/run_tests.gd

      - name: Web 版を書き出す
        run: |
          mkdir -p build/web
          ~/godot/godot --headless --path . --export-release "Web" build/web/index.html
          ls -la build/web
          test -f build/web/index.wasm

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
